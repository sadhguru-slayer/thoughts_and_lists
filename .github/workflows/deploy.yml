name: Deploy to OCI

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle Cloud VM
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "Connected to OCI server"
            cd ~/thoughts_and_lists
            echo "Fetching latest code"
            git fetch origin
            git reset --hard origin/master
            echo "Stopping old Python backend (if running)"
            if [ -d "backend" ]; then
              cd backend
              docker compose -f docker-compose.dev.yaml down || true
              cd ..
            fi
            echo "Moving to Go backend directory"
            cd backend-go
            echo "Ensuring .env exists"
            if [ ! -f .env ] && [ -f ../backend/.env ]; then
              cp ../backend/.env .env
              echo "Copied .env from backend to backend-go"
            fi
            echo "Building and starting Go backend container"
            docker compose -f docker-compose.dev.yaml up -d --build
            echo "Running containers:"
            docker compose -f docker-compose.dev.yaml ps
            echo "Deployment completed successfully"